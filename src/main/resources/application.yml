server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: nutrition-service-route
          uri: lb://nutrition-service
          predicates:
            - Path=/api/v1/nutrition/**

        - id: ai-service-route
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: health-sync-service-route
          uri: lb://health-sync-service
          predicates:
            - Path=/api/v1/health/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Centralized Swagger UI Aggregator Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "1. Nutrition & Food Service"
        url: "/api/v1/nutrition/v3/api-docs"
      - name: "2. AI Vision Service"
        url: "/api/v1/ai/v3/api-docs"
      - name: "3. Auth & User Service"
        url: "/api/v1/auth/v3/api-docs"
      - name: "4. Health Sync Service"
        url: "/api/v1/health/v3/api-docs"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

